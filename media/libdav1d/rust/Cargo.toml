[package]
name = "moz_rav1d"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
crate-type = ["staticlib"]
path = "lib.rs"
test = false
doctest = false

[dependencies]
mozglue-static = { path = "../../../mozglue/static/rust" }
mozilla-central-workspace-hack = { version = "0.1", features = ["moz_rav1d"], optional = true }
rav1d = { path = "../../../third_party/rav1d", default-features = false, features = [
    "asm",
    "asm_arm64_dotprod",
    "asm_arm64_i8mm",
    "asm_arm64_sve2",
    "bitdepth_8",
    "bitdepth_16",
] }

[features]
moz_memory = ["mozglue-static/moz_memory"]
